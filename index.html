<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky header → 요약 스트립 → 필터 툴바 → 카드 그리드 / 장부(표) 토글, 상세는 오른쪽 드로어 */
/* Layout: 밤/낮 테마 · 상단 로고+탭(매물 관리/캘린더/메모장) → 탭별 패널 */
:root{
  --bg:#0a0a0a; --surface:#141414; --surface-2:#1e1e1e; --line:#2b2b2b; --fg:#f3f3f3; --muted:#8e8e8e;
  --accent:#ffffff; --accent-fg:#0a0a0a; --accent-soft:#262626;
  --jeonse:#93b7ee; --jeonse-bg:#18233a; --wolse:#81d2a6; --wolse-bg:#132c20;
  --maemae:#e9aa6a; --maemae-bg:#33230f; --sangga:#c4a4ea; --sangga-bg:#281e3a;
  --office:#7fd4d6; --office-bg:#10292a;
  --warn:#ff8a72; --warn-bg:#3a1a13; --caution:#e8c65f; --caution-bg:#2f270e;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#f7f7f7; --surface-2:#eeeeee; --line:#d6d6d6; --fg:#111111; --muted:#666666;
  --accent:#111111; --accent-fg:#ffffff; --accent-soft:#e8e8e8;
  --jeonse:#2259a4; --jeonse-bg:#eaf1fc; --wolse:#206d43; --wolse-bg:#e6f4eb;
  --maemae:#95500d; --maemae-bg:#fff0df; --sangga:#7341a0; --sangga-bg:#f2eafa;
  --office:#176c70; --office-bg:#e5f4f4;
  --warn:#b83725; --warn-bg:#ffece7; --caution:#806113; --caution-bg:#fff5d5;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.1);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
.auth-gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,360px);text-align:center}.auth-mark{width:48px;height:48px;margin:0 auto 12px;border-radius:12px;background:var(--fg);color:var(--bg);font:600 32px/48px var(--mono)}.auth-card h1{margin:0;font:600 24px var(--mono)}.auth-card p{color:var(--muted);margin:8px 0 20px}.auth-card form{display:flex;gap:8px}.auth-card input{min-width:0;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.auth-error{color:var(--warn)!important;font-size:13px}.auth-gate[hidden]{display:none!important}
body:not(.admin-mode) [data-admin-only]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.brand .save{font-size:12px;color:var(--muted);white-space:nowrap}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.btn.ghost{background:transparent;border-color:transparent}
.btn svg{width:16px;height:16px}
.theme-switch{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;background:var(--surface)}
.theme-switch button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:5px 9px;font-size:12px;font-weight:600}
.theme-switch button.on{background:var(--accent);color:var(--accent-fg)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding-block:18px 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;min-width:0}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:22px;font-weight:600;margin-top:2px}
.stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat.alert .v{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:1000px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--caution-bg);color:var(--caution);font-size:13px}
.banner .btn{padding:4px 10px;font-size:12px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.search input{border:0;background:transparent;padding:9px 0;width:100%;outline:none}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--fg);font-weight:600}
.count{font-size:13px;color:var(--muted);margin-left:auto}

/* chips */
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.k-전세{color:var(--jeonse);background:var(--jeonse-bg)}
.k-월세{color:var(--wolse);background:var(--wolse-bg)}
.k-매매{color:var(--maemae);background:var(--maemae-bg)}
.k-상가{color:var(--sangga);background:var(--sangga-bg)}
.k-사무실{color:var(--office);background:var(--office-bg)}
.d-사무실{background:var(--office)}
.tag.ins-ok{color:var(--wolse);border-color:var(--wolse)}
.tag.ins-bad{color:var(--warn);border-color:var(--warn)}
.okc{color:var(--wolse)} .badc{color:var(--warn)}
.paste{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.paste summary{cursor:pointer;font-weight:600;font-size:13px}
.paste[open] summary{margin-bottom:10px}
.paste textarea{width:100%;min-height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
.paste .row{margin-top:8px}
.comrow{display:flex;gap:6px}
.comrow input{flex:1;min-width:0}
.tplout{margin:0 18px 12px;min-height:180px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;color:var(--fg)}
.d-전세{background:var(--jeonse)}.d-월세{background:var(--wolse)}.d-매매{background:var(--maemae)}.d-상가{background:var(--sangga)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.s-계약진행{color:var(--caution);border-color:var(--caution)}
.tag.s-계약완료{color:var(--muted);background:var(--surface-2)}
.tag.sample{border-style:dashed}
.dday{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.dday.urgent{background:var(--warn-bg);color:var(--warn)}
.dday.soon{background:var(--caution-bg);color:var(--caution)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow);border-color:var(--muted)}
.card.done{opacity:.62}
.ph{aspect-ratio:16/10;max-width:100%;width:100%;background:var(--surface-2);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;
  background-image:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 55%,transparent) 10px 11px)}
.ph .pc{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:1px 7px;border-radius:999px}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.addr{font-weight:600;font-size:15px;letter-spacing:-.01em}
.addr small{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.price{font-size:19px;font-weight:600}
.price .unit{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:40px}
table{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .thumb{width:44px;height:32px;border-radius:5px;object-fit:cover;display:block;background:var(--surface-2)}
td.notec{max-width:260px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

.empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-bottom:40px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex}
.drawer{margin-left:auto;width:min(520px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header,.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.drawer header h2,.modal header h2{margin:0;font-size:16px;flex:1;min-width:0}
.drawer .scroll,.modal .scroll{overflow:auto;flex:1;padding:18px}
.drawer footer,.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.gal .main{aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2);position:relative}
.gal .main img{width:100%;height:100%;object-fit:cover;display:block}
.gal .thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.gal .thumbs button{border:2px solid transparent;padding:0;border-radius:6px;overflow:hidden;flex:none;background:none}
.gal .thumbs button.on{border-color:var(--accent)}
.gal .thumbs img{width:64px;height:48px;object-fit:cover;display:block}
dl.facts{display:grid;grid-template-columns:96px 1fr;gap:0;margin:16px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
dl.facts dt,dl.facts dd{margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
dl.facts dt{color:var(--muted);font-size:13px;background:var(--surface-2)}
dl.facts dd{min-width:0;overflow-wrap:anywhere}
dl.facts > :nth-last-child(-n+2){border-bottom:0}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone .btn{padding:3px 9px;font-size:12px}
.notes{white-space:pre-wrap}

.modal{margin:auto;width:min(720px,100%);max-height:100%;background:var(--bg);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
@media (max-width:640px){.modal{border-radius:0;height:100%}.scrim{align-items:stretch}}
@media (min-width:641px){.scrim.center{padding:24px}}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lab{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f .hint{font-size:11px;color:var(--muted)}
.unitbox{position:relative}
.unitbox input{padding-right:42px}
.unitbox span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:640px){.c4,.c3,.c2{grid-column:span 6}.c2.half,.c3.half{grid-column:span 3}}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick input{position:absolute;width:1px;height:1px;margin:0;clip-path:inset(50%);opacity:0;pointer-events:none}
.pick label{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--fg);cursor:pointer}
.pick input:checked + label{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pick input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pthumbs{display:flex;gap:8px;flex-wrap:wrap}
.pthumbs .pt{position:relative;width:84px;height:64px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.pthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pthumbs .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.pthumbs .cover{position:absolute;left:3px;bottom:3px;font-size:10px;background:var(--accent);color:var(--accent-fg);padding:0 5px;border-radius:4px}
.err{color:var(--warn);font-size:12px}

.addr .sub{font-size:12px;font-weight:400;color:var(--muted)}
.tag.flag{color:var(--accent);border-color:var(--accent)}
.reshead{font-size:13px;color:var(--muted);margin-bottom:10px}
.reshead b{color:var(--fg)}
.bgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.bhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bhead > div:nth-child(2){flex:1}
.bthumb{width:56px;height:42px;border-radius:6px;overflow:hidden;background:var(--surface-2);flex:none}
.bthumb img{width:100%;height:100%;object-fit:cover;display:block}
.tablewrap.flat{border:0;border-radius:0;margin:0}
table.units{min-width:560px}
table.units tr:last-child td{border-bottom:0}
.sibh{font-size:13px;color:var(--muted);margin:20px 0 8px;font-weight:600}
.sibs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sib{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.sib b{color:var(--fg);font-size:14px}
.sib .num{color:var(--fg)}
.sib:hover{border-color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow)}
/* header · logo · tabs */
.top .wrap{flex-wrap:wrap;row-gap:0}
.logo{display:flex;align-items:center;gap:9px;flex:none;color:var(--fg);text-decoration:none}
.logo svg{height:28px;width:auto;display:block}
.logo .wm{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:-.02em;line-height:1}
.tabs{display:flex;gap:4px;margin-left:18px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:600;position:relative}
.tabs button:hover{color:var(--fg);background:var(--surface)}
.tabs button.on{color:var(--fg)}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-15px;height:2px;background:var(--accent)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){
  .tabs{order:5;width:100%;margin:10px 0 0;border-top:1px solid var(--line);padding-top:4px}
  .tabs button{flex:1}
  .tabs button.on::after{bottom:-4px}
  .save,.top .addtxt{display:none}
}
.muted{color:var(--muted)}

/* calendar */
.calbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:18px 12px}
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{margin:0 6px;font-size:20px;min-width:118px;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i,.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
i.ev{background:var(--accent)} i.mo{background:var(--warn)} i.ex{background:var(--caution)}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding-bottom:40px;align-items:start}
@media (max-width:900px){.calwrap{grid-template-columns:1fr}}
.calgrid-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wk,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk span{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wk span:first-child{color:var(--warn)}
.day{min-height:104px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface-2)}
.day .dn{font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.sun .dn{color:var(--warn)}
.day.out{opacity:.38}
.day.today .dn{background:var(--accent);color:var(--accent-fg);font-weight:600}
.day.sel{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent)}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.evs .ev{font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evs .ev.ev{background:var(--accent-soft);color:var(--fg)}
.evs .ev.mo{background:var(--warn-bg);color:var(--warn)}
.evs .ev.ex{background:var(--caution-bg);color:var(--caution)}
.evs .more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
@media (max-width:640px){.day{min-height:58px;padding:4px}.evs{display:none}.dots{display:flex}}
.daypanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.daypanel h3{margin:0;font-size:16px}
.dplist{display:flex;flex-direction:column;gap:6px}
.dpi{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;width:100%}
.dpi .kind{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;flex:none;margin-top:1px}
.dpi.mo .kind{background:var(--warn-bg);color:var(--warn)}
.dpi.ex .kind{background:var(--caution-bg);color:var(--caution)}
button.dpi.ex:hover{border-color:var(--muted)}
.dpi.ev .kind{background:var(--accent);color:var(--accent-fg)}
.dpi .txt{display:block;min-width:0;overflow-wrap:anywhere}
.dpi .event-content{flex:1;min-width:0}
.event-memo{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;color:var(--fg);cursor:pointer}.event-memo:hover{color:var(--accent)}
.memo-popup{width:min(560px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 48px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}.memo-popup header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.memo-popup header h2{font-size:18px;margin:0;flex:1}.memo-popup .memo-popup-body{padding:20px 18px;overflow:auto;font-size:18px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.dpi .x{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:12px;white-space:nowrap}
.dpi .x.armed{color:var(--warn);font-weight:600}
button.dpi.mo:hover{border-color:var(--muted)}
.evform{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.evform input,.evform textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.evform textarea{min-height:120px;resize:vertical;font-size:16px;line-height:1.6}
.evform .row{flex-wrap:nowrap}
.evform .row input{flex:1}

/* memo */
.memo{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding-block:18px 40px;min-height:calc(100vh - 120px)}
.mlist{display:flex;flex-direction:column;gap:10px;min-width:0}
.mtools{display:flex;gap:8px}
.mtools .search{flex:1;min-width:0}
#memoList{display:flex;flex-direction:column;gap:6px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%;min-width:0}
.mi:hover{border-color:var(--muted)}
.mi.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mi .mt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.mi .mp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pin{font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-fg);padding:0 5px;border-radius:4px;flex:none}
.meditor{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mehead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mehead .back{display:none}
.meditor textarea{flex:1;border:0;background:transparent;resize:none;padding:18px 20px;font-size:15px;line-height:1.7;outline:none;min-height:420px}
.empty-ed{margin:auto;color:var(--muted);padding:40px}
@media (max-width:720px){
  .memo{grid-template-columns:1fr;min-height:0}
  .memo.editing .mlist{display:none}
  .memo:not(.editing) .meditor{display:none}
  .mehead .back{display:inline-flex}
}
/* 일정 종류에만 포인트 컬러 적용 · 글자 태그를 함께 표시 */
.event-계약{--event-fg:var(--sangga);--event-bg:var(--sangga-bg)}
.event-입주{--event-fg:var(--wolse);--event-bg:var(--wolse-bg)}
.event-매물소개{--event-fg:var(--jeonse);--event-bg:var(--jeonse-bg)}
.event-퇴실{--event-fg:var(--warn);--event-bg:var(--warn-bg)}
.pick label[class^="event-"]{color:var(--event-fg);border-color:var(--event-fg);background:var(--event-bg);opacity:.72}
.pick input:checked + label[class^="event-"]{color:var(--event-fg);border-color:var(--event-fg);background:var(--event-bg);box-shadow:inset 0 0 0 1px var(--event-fg);opacity:1}
.evform .pick label{flex:1;text-align:center;padding-inline:10px}
.evs .ev.ev[class*="event-"]{color:var(--event-fg,var(--fg));background:var(--event-bg,var(--accent-soft));border-left:2px solid var(--event-fg,var(--accent))}
.dots i[class*="event-"]{background:var(--event-fg,var(--accent))}
.event-tag{color:var(--event-fg);background:var(--event-bg);border-color:var(--event-fg)}
@media (max-width:520px){.top .wrap{gap:8px}.theme-switch button{padding:5px 8px}.logo .wm{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="authGate" class="auth-gate"><div class="auth-card"><div class="auth-mark">q</div><h1>qwerty</h1><p>매물 정보를 보려면 비밀번호를 입력하세요.</p><form id="authForm"><input id="authPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호"><button class="btn primary" type="submit">입장</button><p id="authError" class="auth-error" hidden>비밀번호를 확인하세요.</p></form></div></div>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#list" aria-label="qwerty 홈"><svg viewBox="228 196 798 822" aria-hidden="true">
<path d="M626 227 L991 535 L927 535 L927 978 Q927 1003 902 1003 L350 1003 Q325 1003 325 978 L325 535 L263 535 Z" fill="var(--fg)" stroke="var(--fg)" stroke-width="30" stroke-linejoin="round"/>
<g fill="var(--bg)">
<ellipse cx="620" cy="568" rx="182" ry="166"/>
<path d="M700 572 H803 V772 H760 V815 H803 V858 H760 V903 H803 V935 L752 978 L700 935 Z"/>
</g>
<ellipse cx="618" cy="582" rx="101" ry="96" fill="var(--fg)"/>
</svg><span class="wm">qwerty</span></a>
    <nav class="tabs" role="tablist" aria-label="메뉴">
      <button type="button" role="tab" data-tab="list">매물 관리</button>
      <button type="button" role="tab" data-tab="cal">캘린더</button>

    <span class="save" id="saveState">불러오는 중…</span>
    <button class="btn primary" id="addBtn" data-admin-only type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="addtxt">매물 등록</span>

<main class="wrap" data-panel="list">

      <input id="q" type="search" placeholder="예) 마포구 투룸 · 신공덕 테라스 · 7372" autocomplete="off">

      <option value="moveout">퇴실 임박순</option>
      <option value="recent">최근 등록순</option>

      <option value="priceAsc">금액 낮은순</option>

<main class="wrap" data-panel="cal" hidden>
  <div class="calbar">
    <div class="calnav">
      <button class="btn" type="button" id="calPrev" aria-label="이전 달">‹</button>
      <h2 id="calTitle" class="num"></h2>
      <button class="btn" type="button" id="calNext" aria-label="다음 달">›</button>

        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="memoQ" type="search" placeholder="메모 검색" autocomplete="off"></div>
        <button class="btn primary" type="button" id="memoNew" data-admin-only>새 메모</button>
      </div>
      <div id="memoList"></div>
    </div>
    <div class="meditor" id="memoEditor"></div>
  </div>
</main>

<div id="overlay"></div>
<div id="toastSlot"></div>

<script>
(() => {
const KINDS = ['전세','월세','매매','상가','사무실'];
const MONTHLY = ['월세','상가','사무실'];
const TYPES = ['1룸','1.5룸','2룸','3룸','기타'];
const STATUSES = ['광고중','계약진행','계약완료'];
const FLAGS = {T:'테라스', D:'복층', H:'높은층고'};
const AGES = ['신축','구축'];
const INS = ['가능','불가','확인필요'];
const REG = ['주택임대사업자','일반임대인','확인필요'];
const TYPE_ALIAS = {'1룸':'1룸 원룸','1.5룸':'1.5룸 1.5 분리형','2룸':'2룸 투룸','3룸':'3룸 쓰리룸'};
const SEED_V = 3;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sharedRole = 'viewer', sharedVersion = 0, sharedReady = false, sharedBusy = false;
const adminPath = '?mode=admin';
const adminRequested = new URLSearchParams(location.search).get('mode') === 'admin';
async function sharedPush(){
  if (!sharedReady || sharedRole!=='admin' || sharedBusy) return;
  sharedBusy=true;
  try {
    const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:sharedVersion,data:{items,events,memos}})});
    if(r.ok){ const out=await r.json(); sharedVersion=out.version; }
    else if(r.status===409) toast('다른 화면에서 먼저 변경했어요. 새로고침 후 확인하세요');
  } catch(e){ toast('공유 저장에 실패했어요. 이 기기에는 저장됐어요'); }
  finally{ sharedBusy=false; }
}
async function sharedPull(){
  if(!sharedReady) return;
  try{ const r=await fetch('/api/state'); if(!r.ok)return; const out=await r.json(); if(out.version!==sharedVersion){ sharedVersion=out.version; items=out.data.items||[]; events=out.data.events||[]; memos=out.data.memos||[]; render(); renderCal(); renderMemo(); } }catch(e){}
}
async function authenticate(){
  const password=$('#authPassword').value;
  const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,role:adminRequested?'admin':'viewer'})});
  if(!r.ok) throw new Error('auth');
  const out=await r.json(); sharedRole=out.role; document.body.classList.toggle('admin-mode',sharedRole==='admin');
  const localSnapshot={items:[...items],events:[...events],memos:[...memos]};
  const state=await fetch('/api/state'); if(state.ok){ let remote=await state.json();
    if(sharedRole==='admin' && remote.version===0 && (localSnapshot.items.length||localSnapshot.events.length||localSnapshot.memos.length)){
      const migrated=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:0,data:localSnapshot})});
      if(migrated.ok) remote=await migrated.json();
    }
    sharedVersion=remote.version; items=remote.data.items||[]; events=remote.data.events||[]; memos=remote.data.memos||[]; sharedReady=true; render(); renderCal(); renderMemo(); }
  $('#authGate').hidden=true; if(sharedRole==='admin') toast('관리자 모드로 입장했어요');
}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();try{await authenticate()}catch(err){$('#authError').hidden=false;$('#authPassword').select()}});
setInterval(sharedPull,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sharedPull()});

let items = [];
const ui = { kind:'전체', type:'', status:'', q:'', sort:'moveout', view:'card' };
try { const v = localStorage.getItem('mm_view'); if (['table','card','bldg'].includes(v)) ui.view = v; } catch(e){}

/* ---------- theme ---------- */
function setTheme(theme){
  theme = theme==='light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('.theme-switch button').forEach(b => {
    const on = b.dataset.theme===theme;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  try { localStorage.setItem('qwerty_theme', theme); } catch(e){}
}
let savedTheme = 'dark';
try { savedTheme = localStorage.getItem('qwerty_theme') || 'dark'; } catch(e){}
setTheme(savedTheme);
document.querySelectorAll('.theme-switch button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));

/* ---------- storage (IndexedDB, 이 기기 브라우저에 저장) ---------- */
const DB = {
  db:null, ok:false,
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('maemuljang',1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.ok = true;
    }catch(e){ this.db=null; this.ok=false; }
  },
  get(k){ return new Promise(res=>{ if(!this.db) return res(undefined);
    try{ const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined);}catch(e){res(undefined)} }); },
  set(k,v){ return new Promise(res=>{ if(!this.db) return res(false);
    try{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); tx.onabort=()=>res(false);}catch(e){res(false)} }); }
};
async function persist(){
  const ok = await DB.set('items', items);
  $('#saveState').textContent = ok ? (sharedReady ? '공유 저장됨' : '이 기기에 자동 저장됨') : '저장 안 됨 · 새로고침하면 사라져요';
  await sharedPush();
  if (ui.tab==='cal') renderCal();
}

/* ---------- helpers ---------- */
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const isoPlus = n => { const d=today0(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function dday(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'); if (isNaN(d)) return null;
  return Math.round((d - today0())/86400000);
}
function ddayHTML(iso){
  const n = dday(iso); if (n===null) return '';
  const cls = n<=14 ? 'urgent' : n<=30 ? 'soon' : '';
  const label = n===0 ? 'D-DAY' : n>0 ? `D-${n}` : `퇴실 +${-n}일`;
  return `<span class="dday ${n<0?'':cls}">${label}</span>`;
}
function man(n){ // 만원 단위 → "3억 5,000" / "8,500"
  n = Number(n); if (!n && n!==0 || isNaN(n)) return '';
  if (n >= 10000){ const e=Math.floor(n/10000), r=n%10000; return `${e}억${r?' '+r.toLocaleString():''}`; }
  return n.toLocaleString();
}
function priceText(it){
  const dep = man(it.deposit);
  if (MONTHLY.includes(it.kind)) return `${dep||'0'} / ${man(it.monthly)||'0'}`;
  return dep || '-';
}
function priceLabel(kind){ return kind==='전세'?'전세금':kind==='매매'?'매매가':'보증금 / 월세'; }
const p2 = n => String(n).padStart(2,'0');
function wonShort(n){ // 원 → "4,086만원" / "2억 5,086만원"
  n = Math.round(Math.abs(+n)/10000); if (!n) return '0원';
  return n>=10000 ? `${Math.floor(n/10000)}억${n%10000?' '+(n%10000).toLocaleString()+'만':''}원` : `${n.toLocaleString()}만원`;
}
function feeShort(n){ n=+n; if(!n) return '-'; return n>=10000 ? `${+(n/10000).toFixed(1)}만` : `${n.toLocaleString()}원`; }
function md(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${+m}월 ${+d}일`; }
function mdShort(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${+m}.${+d}`; }
// 보증금이 공시지가 126% 안에 들어오는지 (보증보험 판단용 참고치)

function parseMan(s){ // "21,000만원" "2억 1,000" "13만원" → 만원 단위 숫자
  s = String(s||'').replace(/[,\s]/g,'');
  let m = s.match(/(\d+(?:\.\d+)?)억(\d+(?:\.\d+)?)?/); if (m) return Math.round(parseFloat(m[1])*10000 + (m[2]?parseFloat(m[2]):0));
  m = s.match(/\d+(?:\.\d+)?/); if (!m) return '';
  let n = parseFloat(m[0]); if (!/만/.test(s) && /원/.test(s) && n>=100000) n = n/10000;
  return Math.round(n);
}
function parseWon(s){ // "95,000원" "9.5만" "2억 5천" → 원
  s = String(s||'').replace(/[,\s]/g,'');
  let m = s.match(/(\d+(?:\.\d+)?)억(\d+(?:\.\d+)?)?(만|천)?/); if (m) return Math.round(parseFloat(m[1])*1e8 + (m[2]?parseFloat(m[2])*(m[3]==='천'?1e7:1e4):0));
  m = s.match(/(\d+(?:\.\d+)?)(만|천)?/); if (!m) return '';
  return Math.round(parseFloat(m[1]) * (m[2]==='만'?1e4:m[2]==='천'?1e3:1));
}
function parseDate(s){
  s = String(s||''); let y, mo, d, m = s.match(/(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
  if (m){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else { m = s.match(/(\d{1,2})\s*[월./-]\s*(\d{1,2})/); if (!m) return '';
    mo=+m[1]; d=+m[2]; const t=today0(); y=t.getFullYear(); if ((t - new Date(y,mo-1,d))/86400000 > 120) y++; }
  if (mo<1||mo>12||d<1||d>31) return '';
  return `${y}-${p2(mo)}-${p2(d)}`;
}
function normType(v){
  if (/1\.5|분리/.test(v)) return '1.5룸';
  if (/(^|[^\d.])1\s*룸|원룸|1\s*R/i.test(v)) return '1룸';
  if (/2\s*룸|투룸|2\s*R/i.test(v)) return '2룸';
  if (/3\s*룸|쓰리룸|3\s*R/i.test(v)) return '3룸';
  return v ? '기타' : '';
}
function splitAddr(v){ // "서대문구 대현동 37-15 프리젠3차 402호" → 주소 / 건물명 / 호수
  v = v.trim(); const m = v.match(/^(.*?\s(?:산\s?)?\d+(?:-\d+)?)(?=\s|$)(.*)$/);
  if (!m) return {addr:v};
  const r = m[2].trim().match(/^(.*?)\s*(\S*\d+호)?$/);
  return {addr:m[1].trim(), bldg:(r&&r[1]||'').trim(), unitNo:(r&&r[2]||'').trim()};
}
function parseTemplate(text){
  const out = {}; let inNotes = false;
  String(text).split(/\r?\n/).forEach(line => {
    const m = line.match(/^\s*[-*•·]?\s*([^:：]{1,30})[:：]\s*(.*)$/);
    if (!m){ if (inNotes && line.trim()) out.notes = (out.notes?out.notes+'\n':'') + line.trim(); return; }
    const k = m[1].replace(/\s/g,''), v = m[2].trim(); inNotes = false;
    if (/주소/.test(k)) Object.assign(out, splitAddr(v));
    else if (/신축|구축/.test(k)) out.age = /신축/.test(v)?'신축':/구축/.test(v)?'구축':'';
    else if (/종류|거래/.test(k)) out.kind = KINDS.find(x=>v.includes(x)) || '';
    else if (/보증보험/.test(k)) out.insurance = /불가|안\s*됨|x/i.test(v)?'불가':/가능|o/i.test(v)?'가능':v?'확인필요':'';
    else if (/임대사업자/.test(k)) out.rentReg = /일반|미가입|미등록|아니|x/i.test(v)?'일반임대인':/사업자|가입|등록|예|o/i.test(v)?'주택임대사업자':v?'확인필요':'';
    else if (/금액|가격|보증금|전세가|매매가/.test(k)){ const [a,b] = v.split('/'); out.deposit = parseMan(a); if (b!==undefined) out.monthly = parseMan(b); }
    else if (/관리비/.test(k)) out.fee = parseWon(v);
    else if (/공시/.test(k)) out.land126 = parseWon(v);
    else if (/퇴실|입주/.test(k)) out.moveout = parseDate(v);
    else if (/만기/.test(k)) out.expiry = parseDate(v);
    else if (/타입|방/.test(k)) out.type = normType(v);
    else if (/임대인/.test(k)) out.landlord = fmtPhone(v);
    else if (/임차인/.test(k)) out.tenant = fmtPhone(v);
    else if (/수수료/.test(k)) out.commission = v;
    else if (/특이|비고|메모/.test(k)){ out.notes = v; inNotes = true; }
  });
  Object.keys(out).forEach(k => { if (out[k]==='' || out[k]===undefined) delete out[k]; });
  return out;
}
function toTemplate(it){
  const amt = MONTHLY.includes(it.kind) ? `${(+it.deposit||0).toLocaleString()}만원/${(+it.monthly||0).toLocaleString()}만원` : (it.deposit?`${(+it.deposit).toLocaleString()}만원`:'');
  return [

function migrate(it){
  const T = {'원룸':'1룸','투룸':'2룸','쓰리룸':'3룸','아파트':'기타','오피스텔':'기타'}; if (T[it.type]) it.type = T[it.type];
  const R = {'등록':'주택임대사업자','미등록':'일반임대인','미정':'확인필요'}; if (R[it.rentReg]) it.rentReg = R[it.rentReg];
  if (it.land126===undefined){
    const n = +String(it.landPrice||'').replace(/,/g,'');
    it.land126 = n>1e6 ? n : '';
    if (it.landPrice && !(n>1e6)) it.notes = (it.notes?it.notes+'\n':'') + `공시지가(이전 입력): ${it.landPrice}`;
    delete it.landPrice;
    if (it.fee!=='' && it.fee!=null && +it.fee>0 && +it.fee<1000) it.fee = Math.round(+it.fee*10000);
    if (it.commission!=='' && it.commission!=null && /^\d+(\.\d+)?$/.test(String(it.commission))) it.commission = `${it.commission}만원`;
  }
  return it;
}
function fmtPhone(v){
  const d = String(v).replace(/\D/g,'').slice(0,11);
  if (d.startsWith('02')) return d.length>9 ? d.replace(/(\d{2})(\d{4})(\d+)/,'$1-$2-$3') : d.replace(/(\d{2})(\d{3})(\d*)/,'$1-$2-$3').replace(/-$/,'');
  if (d.length>10) return d.replace(/(\d{3})(\d{4})(\d+)/,'$1-$2-$3');
  if (d.length>6) return d.replace(/(\d{3})(\d{3})(\d+)/,'$1-$2-$3');
  if (d.length>3) return d.replace(/(\d{3})(\d+)/,'$1-$2');
  return d;
}

function filtered(){
  const tokens = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = items.filter(it => {
    if (ui.kind==='임박') { const n=dday(it.moveout); if (n===null || n<0 || n>30 || it.status==='계약완료') return false; }
    else if (ui.kind!=='전체' && it.kind!==ui.kind) return false;
    if (ui.type && it.type!==ui.type) return false;
    if (ui.status && it.status!==ui.status) return false;
    if (tokens.length){
      const hay = [it.bldg,it.addr,it.unitNo,it.notes,it.kind,it.status,TYPE_ALIAS[it.type]||it.type,
        ...(it.flags||[]).map(f=>FLAGS[f]), it.rentReg, it.age, it.commission, it.insurance==='가능'?'보증보험가능 보증보험':''].join(' ').toLowerCase();
      const phones = (String(it.landlord||'')+' '+String(it.tenant||'')).replace(/[^\d ]/g,'');
      // 띄어쓴 단어가 모두 들어있는 매물만 (예: "마포구 투룸", "신공덕 테라스")
      const ok = tokens.every(t => hay.includes(t) || (t.replace(/\D/g,'').length>=3 && phones.replace(/ /g,'').includes(t.replace(/\D/g,''))));
      if (!ok) return false;
    }
    return true;
  });
  const dd = it => { const n=dday(it.moveout); return n===null ? 1e9 : (n<0 ? 1e8+(-n) : n); };
  const sorters = {
    moveout:(a,b)=>dd(a)-dd(b),
    recent:(a,b)=>b.createdAt-a.createdAt,
    priceDesc:(a,b)=>(+b.deposit||0)-(+a.deposit||0),
    priceAsc:(a,b)=>(+a.deposit||0)-(+b.deposit||0),
  };
  return list.sort(sorters[ui.sort]);
}

function compress(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const img = new Image();
      img.onload = () => { const max=1400; const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.82)); };
      img.onerror = () => res(null); img.src = r.result; };
    r.onerror = () => res(null); r.readAsDataURL(file);
  });
}

  $('#xBtn').addEventListener('click', closeOverlay);
  $('#cancelBtn').addEventListener('click', closeOverlay);
  const f = $('#mform');

  const showHint = () => {
    const n=+$('#f_dep').value; $('#depHint').textContent = n ? `= ${man(n)} 만원` : '';
    const fee=+$('#f_fee').value; $('#feeHint').textContent = fee ? `= ${fee.toLocaleString()}원` : '';
    const land=+$('#f_land').value;
    const r = insInfo({deposit:$('#f_dep').value, land126:land});
    $('#landHint').innerHTML = land ? `= ${wonShort(land)}${r?` · ${r.ok?`<span class="okc">보증금이 126% 이내 (여유 ${wonShort(r.diff)})</span>`:`<span class="badc">보증금이 126% 초과 (${wonShort(r.diff)} 넘음)</span>`}`:''}` : '';
  };
  const syncKind = () => {
    const k = f.kind.value;
    $('#depLab').textContent = k==='전세'?'전세금':k==='매매'?'매매가':'보증금';
    $('#monthlyBox').hidden = !MONTHLY.includes(k);
    showHint();
  };
  f.querySelectorAll('input[name=kind]').forEach(r=>r.addEventListener('change', syncKind));
  ['#f_dep','#f_fee','#f_land'].forEach(s => $(s).addEventListener('input', showHint));
  ['#f_ll','#f_tn'].forEach(s => $(s).addEventListener('input', e => { e.target.value = fmtPhone(e.target.value); }));
  f.querySelectorAll('[data-com]').forEach(b => b.addEventListener('click', () => { $('#f_com').value = b.dataset.com; }));
  syncKind();

  if ($('#formTemplateCopy')) $('#formTemplateCopy').addEventListener('click', copyBlankTemplate);
  if ($('#insertTemplateBtn')) $('#insertTemplateBtn').addEventListener('click', () => {
    const box = $('#f_paste');
    if (box.value.trim() && !confirm('작성 중인 양식을 지우고 빈 양식을 넣을까요?')) return;
    box.value = blankTemplate(); box.focus(); box.setSelectionRange(4,4);
    $('#pasteMsg').textContent = '각 항목의 콜론 뒤에 내용을 입력한 다음 채우기를 누르세요. 금액은 만원, 관리비·공시지가는 원 단위로 입력하세요.';
  });
  if ($('#pasteBtn')) $('#pasteBtn').addEventListener('click', () => {
    const o = parseTemplate($('#f_paste').value);
    const keys = Object.keys(o);
    if (!keys.length){ $('#pasteMsg').textContent = '읽을 수 있는 항목이 없어요. "항목 : 값" 형식인지 확인하세요'; return; }
    ['addr','bldg','unitNo','deposit','monthly','fee','land126','moveout','expiry','landlord','tenant','commission','notes'].forEach(k => { if (o[k]!==undefined && f[k]) f[k].value = o[k]; });
    ['age','kind','type','insurance','rentReg'].forEach(k => { const r = o[k] && [...f.querySelectorAll(`input[name="${k}"]`)].find(x=>x.value===o[k]); if (r) r.checked = true; });
    syncKind();
    $('#pasteMsg').textContent = `${keys.length}개 항목을 채웠어요. 날짜·금액이 맞는지 확인하고 등록하세요`;
    toast(`${keys.length}개 항목을 채웠어요`);
  });

  const drawPhotos = () => {
    $('#pthumbs').innerHTML = d.photos.map((p,i)=>`<div class="pt"><img src="${p}" alt="사진 ${i+1}">${i===0?'<span class="cover">대표</span>':''}<button type="button" class="x" data-i="${i}" aria-label="사진 삭제">✕</button></div>`).join('');
    $('#pthumbs').querySelectorAll('.x').forEach(b=>b.addEventListener('click',()=>{ d.photos.splice(+b.dataset.i,1); drawPhotos(); }));
  };
  const addFiles = async files => {
    const imgs = [...files].filter(x=>x.type.startsWith('image/'));
    for (const file of imgs){ const url = await compress(file); if (url) d.photos.push(url); }
    drawPhotos();
  };
  drawPhotos();
  $('#f_photos').addEventListener('change', e => { addFiles(e.target.files); e.target.value=''; });
  const drop = $('#drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const addr = f.addr.value.trim();
    if (!addr){ $('#addrErr').hidden=false; f.addr.focus(); return; }
    const kind = f.kind.value;
    const rv = n => f.querySelector(`input[name="${n}"]:checked`)?.value || '';
    const rec = {
      ...(it||{}), id: it?.id || uid(), createdAt: it?.createdAt || Date.now(),
      addr, bldg:f.bldg.value.trim(), unitNo:f.unitNo.value.trim(), area:f.area.value,
      flags:[...f.querySelectorAll('input[name=flags]:checked')].map(x=>x.value),
      age:rv('age'), kind, type:rv('type'), status:rv('status')||'광고중', insurance:rv('insurance'), rentReg:rv('rentReg'),
      deposit:f.deposit.value, monthly:MONTHLY.includes(kind)?f.monthly.value:'',
      fee:f.fee.value, land126:f.land126.value, commission:f.commission.value.trim(),
      moveout:f.moveout.value, expiry:f.expiry.value, landlord:f.landlord.value.trim(), tenant:f.tenant.value.trim(),
      notes:f.notes.value.trim(), photos:d.photos,
    };
    delete rec.sample; delete rec.landPrice;
    if (it) items = items.map(i=>i.id===it.id?rec:i); else items.unshift(rec);
    await persist(); closeOverlay(); render(); toast(it?'수정했어요':'매물을 등록했어요');
  });
  setTimeout(()=>(src?f.unitNo:($('#f_paste')||f.addr)).focus(),0);
}

/* ---------- tabs ---------- */
const TABS = ['list','cal','memo'];
function setTab(t){
  if (!TABS.includes(t)) t = 'list';
  ui.tab = t; try{ localStorage.setItem('mm_tab', t); }catch(e){}
  document.querySelectorAll('.tabs button').forEach(b => { const on = b.dataset.tab===t; b.classList.toggle('on',on); b.setAttribute('aria-selected', on); });
  document.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel!==t);
  $('#addBtn').hidden = t!=='list';
  if (t==='list') render(); if (t==='cal') renderCal(); if (t==='memo') renderMemo();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('.logo').addEventListener('click', e => { e.preventDefault(); setTab('list'); });

/* ---------- calendar ---------- */
let events = [];
const EVENT_TAGS = ['계약','입주','매물소개','퇴실'];
const saveEvents = async () => { const ok=await DB.set('events', events); await sharedPush(); return ok; };
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => isoOf(new Date());
const cal = { y:new Date().getFullYear(), m:new Date().getMonth(), sel:null };
function dayItems(ds){
  const ev = events.filter(e=>e.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))
    .map(e=>({t:'ev', id:e.id, tag:e.tag||'', label:`${e.tag?'['+e.tag+'] ':''}${e.time?e.time+' ':''}${e.title}`}));
  const mo = items.filter(i=>i.moveout===ds && i.status!=='계약완료')
    .map(i=>({t:'mo', id:i.id, label:`퇴실 ${(i.bldg||i.addr)} ${i.unitNo||''}`.trim()}));
  const ex = items.filter(i=>i.expiry===ds && i.status!=='계약완료')
    .map(i=>({t:'ex', id:i.id, label:`만기 ${(i.bldg||i.addr)} ${i.unitNo||''}`.trim()}));
  return [...ev, ...mo, ...ex];
}
function renderCal(){
  cal.sel ||= todayIso();
  const first = new Date(cal.y, cal.m, 1), start = first.getDay(), days = new Date(cal.y, cal.m+1, 0).getDate();
  const rows = Math.ceil((start+days)/7), t = todayIso();
  let html = '';
  for (let i=0;i<rows*7;i++){
    const d = new Date(cal.y, cal.m, 1-start+i), ds = isoOf(d), its = dayItems(ds);
    html += `<button type="button" class="day ${d.getMonth()!==cal.m?'out':''} ${ds===t?'today':''} ${ds===cal.sel?'sel':''} ${d.getDay()===0?'sun':''}" data-date="${ds}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일, 일정 ${its.length}건">
      <span class="dn num">${d.getDate()}</span>
      <span class="evs">${its.slice(0,3).map(x=>`<span class="ev ${x.t} event-${esc(x.tag||'')}">${esc(x.label)}</span>`).join('')}${its.length>3?`<span class="more">+${its.length-3}</span>`:''}</span>
      <span class="dots">${its.slice(0,4).map(x=>`<i class="${x.t} event-${esc(x.tag||'')}"></i>`).join('')}</span></button>`;
  }
  $('#calTitle').textContent = `${cal.y}년 ${cal.m+1}월`;
  $('#calGrid').innerHTML = html;
  $('#calGrid').querySelectorAll('.day').forEach(b => b.addEventListener('click', () => {
    cal.sel = b.dataset.date; const d = new Date(cal.sel+'T00:00:00');
    cal.y = d.getFullYear(); cal.m = d.getMonth(); renderCal();
  }));
  renderDay();
}
function openEventMemo(id){
  const e=events.find(v=>v.id===id); if(!e?.memo) return;
  $('#overlay').innerHTML=`<div class="scrim center" id="memoScrim"><article class="memo-popup" role="dialog" aria-modal="true" aria-label="일정 메모"><header><h2>${esc(e.title)}</h2><button class="btn ghost" type="button" id="memoPopupClose" aria-label="메모 닫기">✕</button></header><div class="memo-popup-body">${esc(e.memo)}</div></article></div>`;
  $('#memoPopupClose').addEventListener('click',closeOverlay);
  $('#memoScrim').addEventListener('click',e=>{if(e.target.id==='memoScrim')closeOverlay()});
  document.addEventListener('keydown',escClose);
}
function renderDay(){
  const ds = cal.sel, d = new Date(ds+'T00:00:00'), its = dayItems(ds);
  $('#dayPanel').innerHTML = `<h3>${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})</h3>
    <div class="dplist">${its.length ? its.map(x => {
      if (x.t==='mo' || x.t==='ex') return `<button type="button" class="dpi ${x.t}" data-lid="${x.id}"><span class="kind">${x.t==='mo'?'퇴실':'만기'}</span><span class="txt">${esc(x.label.replace(/^(퇴실|만기) /,''))}<small>매물 상세 보기 ›</small></span></button>`;
      const e = events.find(v=>v.id===x.id);
      return `<div class="dpi ev"><span class="kind">${e.time?esc(e.time):'종일'}</span><div class="event-content"><span class="txt">${e.tag?`<span class="tag event-tag event-${esc(e.tag)}">${esc(e.tag)}</span> `:''}${esc(e.title)}</span>${e.memo?`<button type="button" class="event-memo" data-memo-id="${e.id}" aria-label="${esc(e.title)} 메모 크게 보기">${esc(e.memo)}</button>`:''}</div><button type="button" class="x" data-del="${e.id}" data-admin-only>삭제</button></div>`;
    }).join('') : '<p class="muted" style="margin:0">일정이 없어요</p>'}</div>
    <form class="evform" id="evForm" data-admin-only>
      <fieldset style="border:0;padding:0;margin:0"><legend class="lab">일정 태그</legend><div class="pick">${EVENT_TAGS.map((tag,i)=>`<input type="radio" name="eventTag" id="eventTag${i}" value="${tag}" ${tag==='매물소개'?'checked':''}><label class="event-${tag}" for="eventTag${i}">${tag}</label>`).join('')}</div></fieldset>
      <input id="ev_title" placeholder="일정 추가 (예: 블루버드 302호 손님 방문)" autocomplete="off">
      <label class="lab" for="ev_memo">메모</label>
      <textarea id="ev_memo" placeholder="일정에 남길 내용을 입력하세요 (선택)"></textarea>
      <div class="row"><input id="ev_time" type="time" aria-label="시간"><button class="btn primary" type="submit">추가</button></div>
    </form>`;
  $('#dayPanel').querySelectorAll('[data-lid]').forEach(b => b.addEventListener('click', () => openDetail(b.dataset.lid)));
  $('#dayPanel').querySelectorAll('[data-memo-id]').forEach(b => b.addEventListener('click', () => openEventMemo(b.dataset.memoId)));
  $('#dayPanel').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='정말 삭제'; setTimeout(()=>{b.classList.remove('armed'); b.textContent='삭제';},3000); return; }
    events = events.filter(e=>e.id!==b.dataset.del); await saveEvents(); renderCal(); toast('일정을 삭제했어요');
  }));
  $('#evForm').addEventListener('submit', async e => {
    e.preventDefault(); const title = $('#ev_title').value.trim(); if (!title){ $('#ev_title').focus(); return; }
    const tag = $('#evForm').querySelector('input[name="eventTag"]:checked')?.value || '매물소개';
    events.push({ id:uid(), date:ds, time:$('#ev_time').value, title, tag, memo:$('#ev_memo').value.trim() });
    await saveEvents(); renderCal(); toast('일정을 추가했어요');
  });
}
$('#calPrev').addEventListener('click', () => { cal.m--; if(cal.m<0){cal.m=11;cal.y--;} renderCal(); });
$('#calNext').addEventListener('click', () => { cal.m++; if(cal.m>11){cal.m=0;cal.y++;} renderCal(); });
$('#calToday').addEventListener('click', () => { const n=new Date(); cal.y=n.getFullYear(); cal.m=n.getMonth(); cal.sel=todayIso(); renderCal(); });

/* ---------- memo ---------- */
let memos = [];
const memoUI = { sel:null, q:'' };
let memoTimer = null;
const saveMemos = () => {
  // 입력 직후 새로고침해도 DB 커밋 전 마지막 내용을 복구할 수 있도록 기록
  const snapshot = JSON.stringify(memos);
  try { localStorage.setItem('qwerty_memos_pending', snapshot); } catch(e){}
  return DB.set('memos', memos).then(ok => {
    try { if (ok && localStorage.getItem('qwerty_memos_pending')===snapshot) localStorage.removeItem('qwerty_memos_pending'); } catch(e){}
    sharedPush();
    return ok;
  });
};
const memoTitle = m => (m.body||'').split('\n').find(l=>l.trim())?.trim() || '새 메모';
const memoPrev = m => (m.body||'').split('\n').filter(l=>l.trim()).slice(1).join(' ').slice(0,80) || '내용 없음';
function fmtWhen(ts){
  const d = new Date(ts), t = new Date();
  return isoOf(d)===isoOf(t) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${d.getMonth()+1}.${d.getDate()}`;
}
function sortedMemos(){
  const q = memoUI.q.toLowerCase();
  return memos.filter(m=>!q || (m.body||'').toLowerCase().includes(q))
    .sort((a,b)=>(!!b.pinned-!!a.pinned) || (b.updatedAt-a.updatedAt));
}
function renderMemoList(){
  const list = sortedMemos();
  $('#memoList').innerHTML = list.length ? list.map(m => `<button type="button" class="mi ${m.id===memoUI.sel?'on':''}" data-mid="${m.id}">
      <div class="mt">${m.pinned?'<span class="pin">고정</span>':''}<span style="overflow:hidden;text-overflow:ellipsis">${esc(memoTitle(m))}</span></div>
      <div class="mp"><span class="num">${fmtWhen(m.updatedAt)}</span> · ${esc(memoPrev(m))}</div></button>`).join('')
    : `<p class="muted" style="margin:8px 4px">${memoUI.q?'검색 결과가 없어요':'메모가 없어요. 새 메모를 눌러 시작하세요'}</p>`;
  $('#memoList').querySelectorAll('[data-mid]').forEach(b => b.addEventListener('click', () => selectMemo(b.dataset.mid)));
}
function dropEmptyMemo(){
  const cur = memos.find(m=>m.id===memoUI.sel);
  if (cur && !(cur.body||'').trim()){ memos = memos.filter(m=>m!==cur); saveMemos(); }
}
function selectMemo(id){ if (id!==memoUI.sel) dropEmptyMemo(); memoUI.sel = id; renderMemo(); }
function renderMemo(){
  if (!memos.some(m=>m.id===memoUI.sel)) memoUI.sel = null;
  if (!memoUI.sel && window.innerWidth>720) memoUI.sel = sortedMemos()[0]?.id || null;
  renderMemoList();
  const m = memos.find(x=>x.id===memoUI.sel);
  $('#memoWrap').classList.toggle('editing', !!m);
  if (!m){ $('#memoEditor').innerHTML = '<div class="empty-ed">메모를 고르거나 새로 만드세요</div>'; return; }
  $('#memoEditor').innerHTML = `<div class="mehead">
      <button class="btn ghost back" type="button" id="memoBack">‹ 목록</button>
      <span class="muted" id="memoSaved" style="font-size:12px">${m.sample?'예시 메모 · ':''}자동 저장됨</span>
      <div style="flex:1"></div>
      <button class="btn" type="button" id="memoPin" data-admin-only>${m.pinned?'고정 해제':'상단 고정'}</button>
      <button class="btn danger" type="button" id="memoDel" data-admin-only>삭제</button></div>
    <textarea id="memoBody" placeholder="첫 줄이 제목이 돼요" aria-label="메모 내용" ${sharedRole==='admin'?'':'readonly'}>${esc(m.body)}</textarea>`;
  $('#memoBody').addEventListener('input', e => {
    m.body = e.target.value; m.updatedAt = Date.now(); delete m.sample;
    $('#memoSaved').textContent = '저장 중…';
    saveMemos().then(ok => {
      if (memoUI.sel===m.id && $('#memoSaved')) $('#memoSaved').textContent = ok ? '자동 저장됨' : '저장 실패';
    });
    clearTimeout(memoTimer);
    memoTimer = setTimeout(renderMemoList, 400);
  });
  $('#memoBack').addEventListener('click', () => { dropEmptyMemo(); memoUI.sel = null; renderMemo(); });
  $('#memoPin').addEventListener('click', async () => { m.pinned = !m.pinned; await saveMemos(); renderMemo(); });
  $('#memoDel').addEventListener('click', async e => {
    const b = e.currentTarget;
    if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='한 번 더 누르면 삭제'; setTimeout(()=>{b.classList.remove('armed'); b.textContent='삭제';},3000); return; }
    memos = memos.filter(x=>x.id!==m.id); memoUI.sel = null; await saveMemos(); renderMemo(); toast('메모를 삭제했어요');
  });
}
$('#memoNew').addEventListener('click', async () => {
  dropEmptyMemo();
  const m = { id:uid(), body:'', pinned:false, updatedAt:Date.now() };
  memos.unshift(m); memoUI.sel = m.id; memoUI.q = ''; $('#memoQ').value = '';
  renderMemo(); $('#memoBody').focus();
});
$('#memoQ').addEventListener('input', e => { memoUI.q = e.target.value.trim(); renderMemoList(); });

function sampleEvents(){
  const y = new Date().getFullYear();
  return [
    { id:uid(), sample:true, date:`${y}-10-08`, time:'', title:'블루버드 신공덕 방문 가능 (예정)', memo:'비밀번호는 분양 담당자에게 개별 연락' },
    { id:uid(), sample:true, date:isoPlus(2), time:'14:00', title:'서교동 투룸 손님 방문', memo:'반려동물 있음 → 협의 가능 매물 위주' },
  ];
}
function sampleMemos(){
  const now = Date.now();
  return [
    { id:uid(), sample:true, pinned:true, updatedAt:now, body:'블루버드 신공덕 안내 체크리스트\n- 10/8 방문 가능 예정, 비번은 담당자에게 받기\n- 선입주 절대 불가 (전입신고 시 취득세 초과분 임차인 배상)\n- 가계약금 200만원, 건축주 계좌 · 반환 불가\n- 전세대출 질권·보증보험 미리 확인\n- 금연 · 반려동물 불가' },
    { id:uid(), sample:true, pinned:false, updatedAt:now-86400e3, body:'손님 문의 답장 템플릿\n안녕하세요, 문의주신 매물 아직 계약 가능합니다.\n방문 원하시는 날짜·시간 알려주시면 일정 잡아드릴게요.' },
  ];
}

/* ---------- boot ---------- */
(async () => {
  await DB.open();
  // 예시 데이터만 제거하고 직접 등록한 매물·일정·메모는 그대로 보존
  const ev = await DB.get('events'); events = Array.isArray(ev) ? ev.filter(e=>!e.sample) : [];
  let mm = await DB.get('memos'), recoveredMemo = false;
  try {
    const pending = JSON.parse(localStorage.getItem('qwerty_memos_pending') || 'null');
    if (Array.isArray(pending)){ mm = pending; recoveredMemo = true; }
  } catch(e){}
  memos = Array.isArray(mm) ? mm.filter(m=>!m.sample) : [];
  if (!Array.isArray(ev) || ev.some(e=>e.sample)) await saveEvents();
  if (recoveredMemo || !Array.isArray(mm) || mm.some(m=>m.sample)) await saveMemos();
  const saved = await DB.get('items');
  items = Array.isArray(saved) ? saved.filter(i=>!i.sample).map(migrate) : [];
  if (!Array.isArray(saved) || saved.some(i=>i.sample)) await persist();
  else $('#saveState').textContent = DB.ok ? '이 기기에 자동 저장됨' : '저장 안 됨 · 새로고침하면 사라져요';
  let startTab = 'list';
  try { const t = localStorage.getItem('mm_tab'); if (TABS.includes(t)) startTab = t; } catch(e){}
  if (TABS.includes(location.hash.slice(1))) startTab = location.hash.slice(1);
  setTab(startTab);
})();
})();
</script>
